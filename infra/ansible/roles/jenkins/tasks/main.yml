- name: Wait for SSH to be ready
  wait_for_connection:
    delay: 10
    timeout: 120

- name: Update dnf cache
  dnf:
    update_cache: yes

- name: Install Java 21
  dnf:
    name: java-21-amazon-corretto-headless
    state: present

- name: Add Jenkins repository
  get_url:
    url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo

- name: Import Jenkins RPM key
  rpm_key:
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    state: present

- name: Install Jenkins
  dnf:
    name: jenkins
    state: present
    update_cache: yes

- name: Install required system packages for Jenkins jobs
  dnf:
    name:
      - python3-pip
      - unzip
      - git
      - jq
    state: present

- name: Install AWS CLI
  shell: |
    curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    unzip -o /tmp/awscliv2.zip -d /tmp
    /tmp/aws/install --update
  args:
    creates: /usr/local/bin/aws

- name: Install Terraform
  shell: |
    curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip \
      -o /tmp/terraform.zip
    unzip -o /tmp/terraform.zip -d /usr/local/bin/
  args:
    creates: /usr/local/bin/terraform

- name: Install Jenkins automation scripts
  copy:
    src: "{{ playbook_dir }}/../../jenkins/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: 'export-api-template.sh', dest: '/usr/local/bin/export-api-template.sh' }
    - { src: 'raise-api-gw-pr.sh', dest: '/usr/local/bin/raise-api-gw-pr.sh' }

- name: Download Jenkins plugin manager
  get_url:
    url: >-
      https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ jenkins_plugin_manager_version }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar
    dest: /usr/local/bin/jenkins-plugin-manager.jar
    mode: "0755"

- name: Render Jenkins plugin list
  template:
    src: plugins.txt.j2
    dest: /tmp/jenkins-plugins.txt
    mode: "0644"

- name: Install Jenkins plugins before first start
  command: >-
    java -jar /usr/local/bin/jenkins-plugin-manager.jar
    --war /usr/share/java/jenkins.war
    --plugin-file /tmp/jenkins-plugins.txt
    --plugin-download-directory /var/lib/jenkins/plugins
  args:
    creates: /var/lib/jenkins/.plugins-installed

- name: Mark plugins as installed
  file:
    path: /var/lib/jenkins/.plugins-installed
    state: touch

- name: Render Jenkins Configuration as Code file
  template:
    src: jenkins.yaml.j2
    dest: /var/lib/jenkins/jenkins.yaml
    owner: jenkins
    group: jenkins
    mode: "0644"

- name: Validate Jenkins variables
  assert:
    that:
      - jenkins_admin_user | length > 0
      - jenkins_admin_password | length > 0
      - jenkins_bitbucket_owner != 'your-workspace'
      - jenkins_bitbucket_repo != 'your-repo'
      - jenkins_bitbucket_branch == 'development'
      - jenkins_base_branch == 'development'
      - jenkins_template_repo_dir | length > 0
      - jenkins_template_s3_bucket != 'your-s3-bucket'
      - jenkins_bitbucket_username != 'set-inventory-or-vault'
      - jenkins_bitbucket_app_password | length > 0 or jenkins_bitbucket_app_password_secret_id != 'set-inventory-or-vault'
    fail_msg: >-
      One or more Jenkins variables are missing or still set to placeholders.

- name: Load Bitbucket app password from AWS Secrets Manager
  command: >-
    aws secretsmanager get-secret-value
    --secret-id {{ jenkins_bitbucket_app_password_secret_id }}
    --query SecretString
    --output text
  register: bitbucket_app_password_secret
  changed_when: false
  no_log: true
  when:
    - jenkins_bitbucket_app_password | length == 0
    - jenkins_bitbucket_app_password_secret_id != 'set-inventory-or-vault'

- name: Set Bitbucket app password from secret value
  set_fact:
    jenkins_bitbucket_app_password: "{{ bitbucket_app_password_secret.stdout }}"
  no_log: true
  when:
    - bitbucket_app_password_secret is defined
    - bitbucket_app_password_secret.stdout is defined
    - bitbucket_app_password_secret.stdout | length > 0

- name: Configure Jenkins startup options
  lineinfile:
    path: /etc/sysconfig/jenkins
    regexp: '^JENKINS_JAVA_OPTIONS='
    line: 'JENKINS_JAVA_OPTIONS="-Djenkins.install.runSetupWizard=false -Dcasc.jenkins.config=/var/lib/jenkins/jenkins.yaml"'
    create: true

- name: Configure Jenkins admin credentials for JCasC
  lineinfile:
    path: /etc/sysconfig/jenkins
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}="{{ item.value }}"'
    create: true
  loop:
    - { key: 'JENKINS_ADMIN_USER', value: '{{ jenkins_admin_user }}' }
    - { key: 'JENKINS_ADMIN_PASSWORD', value: '{{ jenkins_admin_password }}' }
    - { key: 'BITBUCKET_OWNER', value: '{{ jenkins_bitbucket_owner }}' }
    - { key: 'BITBUCKET_REPO', value: '{{ jenkins_bitbucket_repo }}' }
    - { key: 'BITBUCKET_BRANCH', value: '{{ jenkins_bitbucket_branch }}' }
    - { key: 'TEMPLATE_REPO_DIR', value: '{{ jenkins_template_repo_dir }}' }
    - { key: 'TEMPLATE_S3_BUCKET', value: '{{ jenkins_template_s3_bucket }}' }
    - { key: 'BASE_BRANCH', value: '{{ jenkins_base_branch }}' }
    - { key: 'BITBUCKET_USERNAME', value: '{{ jenkins_bitbucket_username }}' }
    - { key: 'BITBUCKET_APP_PASSWORD', value: '{{ jenkins_bitbucket_app_password }}' }

- name: Ensure Jenkins plugin directory permissions are correct
  file:
    path: /var/lib/jenkins/plugins
    owner: jenkins
    group: jenkins
    recurse: true
    state: directory

- name: Enable and start Jenkins with automated bootstrap
  systemd:
    name: jenkins
    state: started
    enabled: true